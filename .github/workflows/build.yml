name: Windows EXE ビルド

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージのインストール
        run: pip install pyinstaller openpyxl jpholiday flask flask-httpauth python-dotenv werkzeug python-pptx

      - name: EXE ビルド
        run: pyinstaller --onefile --windowed --name "DailyReportApp" daily_report_app.py

      - name: ドキュメント（Excel）生成
        run: python generate_docs.py

      - name: LibreOffice をインストール（PPTX→PDF変換用）
        run: choco install libreoffice-fresh --no-progress -y

      - name: setup_guide.pptx を PDF に変換
        shell: pwsh
        run: |
          $pptx   = (Resolve-Path "dist_docs\setup_guide.pptx").Path
          $outdir = (Resolve-Path "dist_docs").Path
          & "C:\Program Files\LibreOffice\program\soffice.exe" --headless --convert-to pdf --outdir $outdir $pptx
          if (-not (Test-Path "dist_docs\setup_guide.pdf")) { throw "PDF変換に失敗しました" }

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: DailyReportApp
          path: dist/DailyReportApp.exe
          retention-days: 30

      - name: GitHub Release を作成・更新
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新ビルド
          files: |
            dist/DailyReportApp.exe
            dist_docs/manual.pptx
            dist_docs/report.pptx
            dist_docs/setup_guide.pptx
            dist_docs/setup_guide.pdf
          make_latest: true
