name: Windows EXE ビルド

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  convert-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージのインストール
        run: pip install python-pptx

      - name: ドキュメント生成
        run: python generate_docs.py

      - name: LibreOffice インストール
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libreoffice-impress

      - name: setup_guide.pptx を PDF に変換
        run: libreoffice --headless --convert-to pdf --outdir dist_docs dist_docs/setup_guide.pptx

      - name: PDF をアーティファクトに保存
        uses: actions/upload-artifact@v4
        with:
          name: pdf-setup-guide
          path: dist_docs/setup_guide.pdf

  build:
    needs: convert-pdf
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージのインストール
        run: pip install pyinstaller openpyxl jpholiday flask flask-httpauth python-dotenv werkzeug python-pptx

      - name: EXE ビルド
        run: pyinstaller --onefile --windowed --name "DailyReportApp" daily_report_app.py

      - name: ドキュメント（Excel）生成
        run: python generate_docs.py

      - name: PDF アーティファクトをダウンロード
        uses: actions/download-artifact@v4
        with:
          name: pdf-setup-guide
          path: dist_docs/

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: DailyReportApp
          path: dist/DailyReportApp.exe
          retention-days: 30

      - name: GitHub Release を作成・更新
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新ビルド
          files: |
            dist/DailyReportApp.exe
            dist_docs/manual.pptx
            dist_docs/report.pptx
            dist_docs/setup_guide.pptx
            dist_docs/setup_guide.pdf
          make_latest: true
