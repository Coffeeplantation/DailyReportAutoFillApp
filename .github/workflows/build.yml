name: Windows EXE ビルド

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージのインストール
        run: pip install pyinstaller openpyxl jpholiday flask flask-httpauth python-dotenv werkzeug

      - name: EXE ビルド
        run: pyinstaller --onefile --windowed --name "DailyReportApp" daily_report_app.py

      - name: ドキュメント（Excel）生成
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          from app import _build_manual, _build_report
          os.makedirs('dist_docs', exist_ok=True)
          with open('dist_docs/manual.xlsx', 'wb') as f:
              f.write(_build_manual().read())
          with open('dist_docs/report.xlsx', 'wb') as f:
              f.write(_build_report().read())
          "

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: DailyReportApp
          path: dist/DailyReportApp.exe
          retention-days: 30

      - name: GitHub Release を作成・更新
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新ビルド
          files: |
            dist/DailyReportApp.exe
            dist_docs/manual.xlsx
            dist_docs/report.xlsx
          make_latest: true
